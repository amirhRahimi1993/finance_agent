[project]
name = "forex-agent"
version = "0.1.0"
description = "Collect official ECB/Fed monetary-policy documents and EUR/USD news metadata"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
